name: Deploy

# Only main ships. `workflow_dispatch` is there so a deploy can be re-run from
# the Actions tab without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. `cancel-in-progress` stays off on purpose: killing a
# half-finished release is worse than making the next one queue behind it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  # Both halves must compile before either is deployed. Render would fail its
  # own build anyway, but failing here means we never start a deploy we already
  # know is broken — and never ship a frontend against an API that didn't move.
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc -b

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Typecheck backend
        run: npx tsc --noEmit
        working-directory: backend

  # ── Backend ────────────────────────────────────────────────────────────────
  # Deployed first. The new frontend may call endpoints the old API does not
  # have, so the API goes live before the UI that depends on it.
  backend:
    name: Deploy API to Render
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for this commit to be live
        env:
          API_URL: ${{ secrets.RENDER_SERVICE_URL }}
          EXPECTED: ${{ github.sha }}
        run: |
          # Waiting for HTTP 200 alone would be meaningless: while Render builds,
          # the PREVIOUS instance is still up and answering 200 quite happily, so
          # the poll would pass in seconds and the frontend would deploy against
          # the old API — exactly what this job exists to prevent.
          #
          # /health reports the commit it is running (RENDER_GIT_COMMIT), so we
          # wait for our own SHA to appear. A free instance builds slowly and may
          # be cold-starting on top of that, hence the generous ceiling.
          echo "Waiting for $EXPECTED at $API_URL/health …"
          for attempt in $(seq 1 60); do
            body=$(curl -s --max-time 30 "$API_URL/health" || true)
            live=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')

            if [ "$live" = "$EXPECTED" ]; then
              echo "Live on $live after ~$((attempt * 15))s"
              exit 0
            fi

            if [ -n "$live" ]; then
              echo "  attempt $attempt: still serving ${live:0:7}"
            else
              echo "  attempt $attempt: no response yet"
            fi
            sleep 15
          done

          echo "::error::$EXPECTED was not live within 15 minutes. Check the Render deploy log."
          exit 1

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Deploy site to Netlify
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite bakes env vars in at build time, and every call site falls back to
      # `http://localhost:5000/api/v1` when the variable is absent. That fallback
      # is right for a developer and useless in production: the build succeeds,
      # Netlify publishes happily, and the live site quietly calls the visitor's
      # own machine. Nothing downstream can detect it, so it has to be caught here.
      - name: Require VITE_API_URL
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (the 'Actions' tab, not Dependabot or Codespaces)."
            exit 1
          fi
          case "$VITE_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::VITE_API_URL points at localhost: $VITE_API_URL"
              exit 1 ;;
            */api/v1) ;;
            *)
              echo "::error::VITE_API_URL should end in /api/v1 — got: $VITE_API_URL"
              exit 1 ;;
          esac
          echo "Building against $VITE_API_URL"

      - name: Build
        env:
          # Vite bakes env vars into the bundle at build time, so this has to be
          # present here — setting it in Netlify's UI would do nothing, because
          # Netlify is not the thing running the build.
          #
          # It ends up readable in the shipped JavaScript. That is fine: it is a
          # public API address, not a credential. Nothing secret belongs in a
          # VITE_ variable.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Belt and braces: the guard above proves the variable was set, this proves
      # it actually reached the bundle. Catches an env-name change in Vite config
      # or a stray committed .env overriding it.
      - name: Check no localhost leaked into the bundle
        run: |
          if grep -rq "localhost:5000" dist/assets/*.js; then
            echo "::error::The built bundle still points at localhost. Something overrode VITE_API_URL."
            exit 1
          fi
          echo "Bundle is clean."

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --message "${GITHUB_SHA::7} — ${GITHUB_ACTOR}" \
            --json > deploy.json
          url=$(jq -r '.ssl_url // .url // empty' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url:-unknown}"

      # Checking dist/ before upload proved not to be enough: a Netlify-side
      # rebuild once replaced the good bundle *during* the deploy, so every
      # earlier check passed and the live site was still wrong. This one asks the
      # published site what it is actually serving, which is the only claim worth
      # making.
      - name: Verify the live site calls the right API
        run: |
          url="${{ steps.netlify.outputs.url }}"
          if [ -z "$url" ]; then
            echo "::error::Could not determine the deploy URL from the Netlify CLI output."
            exit 1
          fi

          asset=$(curl -fsSL "$url" | grep -o '/assets/index-[^"]*\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::index.html on $url references no main bundle."
            exit 1
          fi
          echo "index.html references $asset"

          if curl -fsSL "$url$asset" | grep -q "localhost:5000"; then
            echo "::error::The bundle the live site serves still points at localhost. A second build overwrote the good one — check for a [build] command in netlify.toml."
            exit 1
          fi
          echo "Live site is calling the deployed API."
