# Netlify configuration for the frontend (the Vite SPA at the repo root).
#
# The build itself runs in GitHub Actions (.github/workflows/deploy.yml), which
# uploads the finished `dist/` — the settings below still apply to whatever is
# served, and they keep the site buildable from Netlify's own CI if the workflow
# is ever bypassed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router owns the URLs. Without this, a visitor who lands directly on
# /admin/login or /dashboard/events — a bookmark, a refresh, a link from an
# email — gets Netlify's 404, because no such file exists on disk. Every path
# has to be handed to index.html so the router can resolve it in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted bundles; never cache the HTML that points at
# them, or a returning visitor keeps loading the previous release's asset names.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
