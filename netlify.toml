# Netlify configuration for the frontend (the Vite SPA at the repo root).
#
# The build runs in GitHub Actions (.github/workflows/deploy.yml) and the CLI
# uploads the finished `dist/`. Everything below describes how those files are
# *served* — nothing here builds anything.
#
# There is deliberately no `command` key. With one present, `netlify deploy`
# runs it through @netlify/build as part of the upload — a second build, inside
# Netlify, where VITE_API_URL does not exist. That rebuild regenerated
# index.html against the localhost fallback and shipped it over the good bundle,
# which is exactly the bug this comment exists to prevent someone re-creating.
# If you ever want Netlify to build the site itself, it needs VITE_API_URL in
# its own environment first.

[build]
  publish = "dist"

# React Router owns the URLs. Without this, a visitor who lands directly on
# /admin/login or /dashboard/events — a bookmark, a refresh, a link from an
# email — gets Netlify's 404, because no such file exists on disk. Every path
# has to be handed to index.html so the router can resolve it in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted bundles; never cache the HTML that points at
# them, or a returning visitor keeps loading the previous release's asset names.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
